appId: com.tayf.studio
productName: Tayf Studio
copyright: Copyright © خليفة القدسي (Khalifa Al-Qudsi)
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - ffmpeg.exe
win:
  target: nsis
  icon: build/icon.ico
  artifactName: Tayf-Studio-${version}-setup.${ext}
  requestedExecutionLevel: asInvoker
  legalTrademarks: Khalifa Al-Qudsi (خليفة القدسي)
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Tayf Studio
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  license: LICENSE
linux:
  target: AppImage
mac:
  target: dmg
